[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finnie"
version = "0.1.0"
description = "Finnie: a multi-agent AI finance assistant for financial education"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Orchestration and LLM
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-community>=0.3",       # FAISS vector store integration
    "langchain-google-genai>=2.0",    # Gemini chat model and embeddings
    # Data models and config
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    # RAG / knowledge base
    "faiss-cpu>=1.8",
    "python-frontmatter>=1.1",
    # Market data
    "requests>=2.31",
    "pandas>=2.0",
    "diskcache>=5.6",
    "tenacity>=8.2",
    # Web UI
    "streamlit>=1.38",
    "plotly>=5.20",
]

[project.optional-dependencies]
local-embeddings = ["sentence-transformers>=3.0"]  # offline embeddings (EMBEDDING_PROVIDER=local); pulls in PyTorch
mcp = ["mcp>=1.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "ruff>=0.5",
    "black>=24.0",
]

[project.scripts]
finnie = "src.cli:main"
finnie-index = "src.rag.index:main"

[tool.setuptools.packages.find]
include = ["src*", "mcp_server*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.black]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=src --cov-report=term-missing"
