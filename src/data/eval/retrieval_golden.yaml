# Golden set for retrieval evaluation (see src/rag/evaluate.py).
#
# Each question lists the article file(s) that answer it; finding any of them counts as a hit.
# Questions are worded the way a user would ask, not copied from article titles, so the
# evaluation tests meaning rather than keyword overlap. When adding an article, add a question.

