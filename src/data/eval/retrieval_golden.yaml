# Questions the knowledge base doesn't cover. Their best match should score below the agents'
# minimum relevance score, so agents answer without citing unrelated articles.
off_topic:
  - What's the best pizza place in New York?
  - How do I fix a flat tire on my bike?
  - Who won the 2022 World Cup?
  - Give me a recipe for chocolate chip cookies.
  - How do I reset my iPhone to factory settings?
  - What's the weather like in Seattle in March?
  - How do I train my puppy to sit?
  - What is the capital of Australia?
